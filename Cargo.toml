[package]
name = "imgurl"
edition = "2024"
authors = ["L0v3m0n3y"]
description = "Rust client for imgur.com API"
readme = "readme.md"
homepage = "https://github.com/l0v3m0n3y/imgur"
repository = "https://github.com/l0v3m0n3y/imgur"
keywords = ["get_tags","get_posts","get_welcome_message","get_post_info","suggest","get_comments","get_user_posts","get_user_info","get_comments_by_user","get_post_meta"]
categories = ["network-programming"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["rt-multi-thread", "macros"] }
thiserror = "1.0"
url = "2.4"
idna = "1.0"
